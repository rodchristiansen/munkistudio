name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # MunkiStudio targets macOS 26 (Tahoe) — the runner needs the
    # macOS 26 SDK / Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: make release

      - name: Test
        run: make test
