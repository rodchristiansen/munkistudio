name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # MunkiStudio targets macOS 26 (Tahoe) — the runner needs the
    # macOS 26 SDK / Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: swift --version

      - name: Build
        run: make release

      - name: Test
        run: make test
