# Builds, signs, notarizes, and publishes the MunkiStudio .pkg.
#
# `make` codesigns the app, then munkipkg builds, signs, notarizes, and
# staples the installer package.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEVELOPER_ID_P12_BASE64     base64 of a .p12 exporting both Developer ID
#                               certificates (Application + Installer) with
#                               their private keys — base64 -i certs.p12
#   DEVELOPER_ID_P12_PASSWORD   password set when exporting the .p12
#   SIGNING_IDENTITY_APP        e.g. Developer ID Application: Org (TEAMID)
#   SIGNING_IDENTITY_INSTALLER  e.g. Developer ID Installer: Org (TEAMID)
#   NOTARY_KEY_BASE64           base64 of the App Store Connect API key .p8 —
#                               base64 -i AuthKey_XXXXXXXXXX.p8
#   NOTARY_KEY_ID               the key's ID, the XXXXXXXXXX in its filename
#   NOTARY_ISSUER_ID            issuer UUID from App Store Connect → Integrations
#
# An API key is used rather than an Apple ID and app-specific password because
# the password is revoked whenever the Apple Account's password changes, which
# breaks the release silently and only at the notarization step.
#
# Triggered manually, or by pushing a tag like v2026.05.19.1430.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release:
    # MunkiStudio targets macOS 26 (Tahoe) — the runner needs the
    # macOS 26 SDK / Xcode 26.
    runs-on: macos-26
    permissions:
      contents: write
    env:
      MUNKIPKG: ${{ github.workspace }}/.tools/munkipkg
      # munkipkg is the Swift rewrite in rodchristiansen/munki-pkg, not the
      # Python original in munki/munki-pkg — the Makefile speaks the rewrite's
      # CLI. It runs with the Developer ID key unlocked, so the release is
      # pinned and its binary checked against a hash recorded here rather than
      # against a checksum file from the same release. Bump both together.
      MUNKIPKG_RELEASE: 2026.07.15.1838
      MUNKIPKG_SHA256: d6170dea1ca592b50ce5e3105bd8f9b2da2feaf450e9d8c5d8446833ee549695
      NOTARIZATION_PROFILE: notarization_credentials
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install munkipkg
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MUNKIPKG")"
          curl -fsSL "https://github.com/rodchristiansen/munki-pkg/releases/download/$MUNKIPKG_RELEASE/munkipkg" -o "$MUNKIPKG"
          echo "$MUNKIPKG_SHA256  $MUNKIPKG" | shasum -a 256 -c -
          chmod +x "$MUNKIPKG"

      - name: Import Developer ID certificates
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certs.p12"

      - name: Store notarization credentials
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$key"
          xcrun notarytool store-credentials "$NOTARIZATION_PROFILE" \
            --key "$key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN"
          rm "$key"

      - name: Build, sign, and notarize
        env:
          SIGNING_IDENTITY_APP: ${{ secrets.SIGNING_IDENTITY_APP }}
          SIGNING_IDENTITY_INSTALLER: ${{ secrets.SIGNING_IDENTITY_INSTALLER }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        # A tag build takes its version from the tag, so the package and the
        # release it is attached to agree. Anything else falls back to the
        # Makefile's build-time stamp.
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then export VERSION="${REF_NAME#v}"; fi
          make

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MunkiStudio-pkg
          path: build/MunkiStudio-*.pkg

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          AUTO_NOTES=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG_NAME" --jq .body)
          AUTO_NOTES=$(printf '%s\n' "$AUTO_NOTES" | sed -E -e 's/ by @[A-Za-z0-9_-]+ in / in /g' -e '/^#+ New Contributors/d' -e '/made their first contribution/d')
          gh release create "$TAG_NAME" build/MunkiStudio-*.pkg --notes "$AUTO_NOTES"
